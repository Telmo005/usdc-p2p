<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ciclo P2P via USDT</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="page">

  <header>
    <h1><span id="title-a">MZN</span> <span class="loop-icon">⟲</span> <span id="title-b">ZAR</span> <span class="via">via USDT</span></h1>
    <div class="status" id="status">a carregar...</div>
  </header>

  <div class="controls-row">
    <div class="balance-row">
      <label for="balance-input">Saldo para o ciclo</label>
      <input type="number" id="balance-input" min="0" step="any" value="1000" />
    </div>

    <div class="fiat-pair-row">
      <div class="field-group">
        <label for="fiat-a-select">Moeda A</label>
        <select id="fiat-a-select" class="fiat-select"></select>
      </div>
      <div class="field-group">
        <label for="method-a-select">Carteira A</label>
        <select id="method-a-select" class="method-select"><option value="">Qualquer</option></select>
      </div>
      <div class="field-group">
        <label for="fiat-b-select">Moeda B</label>
        <select id="fiat-b-select" class="fiat-select"></select>
      </div>
      <div class="field-group">
        <label for="method-b-select">Carteira B</label>
        <select id="method-b-select" class="method-select"><option value="">Qualquer</option></select>
      </div>
    </div>

    <div class="toggle-group">
      <label>Começar em</label>
      <div class="toggle" id="start-toggle">
        <button type="button" class="toggle-btn active" data-start="a">A</button>
        <button type="button" class="toggle-btn" data-start="b">B</button>
      </div>
    </div>

    <div class="toggle-group">
      <label>Mostrar</label>
      <div class="toggle" id="mode-toggle">
        <button type="button" class="toggle-btn active" data-mode="full">Ciclo completo</button>
        <button type="button" class="toggle-btn" data-mode="partial">Só ida</button>
      </div>
    </div>
  </div>

  <section class="cycle-panel" id="cycle-panel">

    <div class="cycle-diagram" id="cycle-diagram">
      <svg class="cycle-svg" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet">
        <defs>
          <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d818c" />
          </marker>
        </defs>
        <path class="arc" id="arc-ne" d="M 200,34 A 166,166 0 0,1 366,200" marker-end="url(#arrowhead)" />
        <path class="arc" id="arc-es" d="M 366,200 A 166,166 0 0,1 200,366" marker-end="url(#arrowhead)" />
        <path class="arc" id="arc-sw" d="M 200,366 A 166,166 0 0,1 34,200" marker-end="url(#arrowhead)" />
        <path class="arc" id="arc-wn" d="M 34,200 A 166,166 0 0,1 200,34" marker-end="url(#arrowhead)" />
      </svg>

      <div class="cnode pos-n" id="node-n" data-currency="a"></div>
      <div class="cnode pos-e" id="node-e" data-currency="usdt"></div>
      <div class="cnode pos-s" id="node-s" data-currency="b"></div>
      <div class="cnode pos-w" id="node-w" data-currency="usdt"></div>

      <div class="ccaption pos-ne" id="cap-ne"></div>
      <div class="ccaption pos-se" id="cap-se"></div>
      <div class="ccaption pos-sw" id="cap-sw"></div>
      <div class="ccaption pos-nw" id="cap-nw"></div>
    </div>

    <div class="result-panel" id="result-panel">
      <div class="balance-compare">
        <div class="balance-box">
          <div class="balance-box-label">Saldo inicial</div>
          <div class="balance-box-value" id="balance-start">—</div>
        </div>
        <div class="balance-arrow">→</div>
        <div class="balance-box" id="balance-end-box">
          <div class="balance-box-label">Saldo final</div>
          <div class="balance-box-value" id="balance-end">—</div>
        </div>
      </div>
      <div class="profit-line" id="profit-line"></div>
      <div class="rate-line" id="rate-line"></div>
    </div>

  </section>

  <section class="scanner-panel">
    <div class="scanner-head">
      <h2>🔍 Explorar outras moedas</h2>
      <button type="button" id="scan-btn" class="scan-btn">Procurar melhor par para <span id="scan-anchor">MZN</span></button>
    </div>
    <p class="hint">Testa a moeda A de cada vez contra várias moedas B, e ordena pelo lucro do ciclo completo.</p>
    <div class="scan-list" id="scan-list"></div>
  </section>

</div>

<script src="app.js"></script>
</body>
</html>
